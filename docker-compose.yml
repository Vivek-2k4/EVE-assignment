services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: eve
      POSTGRES_USER: eve
      POSTGRES_PASSWORD: eve
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eve -d eve"]
      interval: 3s
      timeout: 3s
      retries: 10

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://eve:eve@db:5432/eve
      DJANGO_SECRET_KEY: change-me-in-real-deployments
      WEBHOOK_SECRET: dev-webhook-secret
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
